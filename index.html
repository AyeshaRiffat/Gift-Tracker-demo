<style>
:root{--bg:#f8f3ea;--card:#fffdf9;--ink:#2a1d1a;--mut:#7a6c66;--line:#eadfd0;--red:#b8433a;--gold:#d4a03c;--green:#4b6b55;--sh:0 1px 6px rgba(80,40,20,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1715;--card:#2a201d;--ink:#f4e9dd;--mut:#b5a398;--line:#40322d;--red:#d9665c;--gold:#e0b04e;--green:#7fa889;--sh:none}}
:root[data-theme="dark"]{--bg:#1e1715;--card:#2a201d;--ink:#f4e9dd;--mut:#b5a398;--line:#40322d;--red:#d9665c;--gold:#e0b04e;--green:#7fa889;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.serif,.big{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;justify-content:space-between}
.logo{font:700 22px Georgia,serif}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
nav button.on,.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;border-radius:8px;font-size:12px}.btn.del{color:var(--red)}
main{max-width:1080px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hero{text-align:center;padding:26px 12px;background:linear-gradient(var(--card),var(--bg));border-radius:14px;border:1px solid var(--line);margin-bottom:12px}
.garland{font-size:24px;letter-spacing:4px;overflow:hidden;white-space:nowrap}
.hero h1{margin:4px 0;font-size:34px}.days{color:var(--red);font:italic 20px Georgia,serif}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}.big{font-size:24px;font-weight:700}
.stat{display:flex;justify-content:space-between;align-items:center}.stat span.e{font-size:30px}
.ring{text-align:center}.r{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:10px auto;position:relative}
.r::before{content:"";position:absolute;inset:11px;background:var(--card);border-radius:50%}.r b{position:relative;font:700 22px Georgia,serif}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;overflow-x:auto;padding-top:8px}
.bc{flex:1;min-width:46px;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bp{display:flex;gap:3px;align-items:flex-end;justify-content:center;flex:1}.bp i{width:12px;border-radius:3px 3px 0 0;display:block}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.over{color:var(--red);font-weight:600}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;text-align:left;color:var(--mut);text-transform:uppercase;padding:9px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line)}
tr.done td{color:var(--mut)}tr.done td.rn{text-decoration:line-through}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:#f1e3c4;color:#6b4e12;white-space:nowrap}
.tag.Friends{background:#d9e8dc;color:#2f5039}.tag.Coworkers{background:#e5dcf0;color:#53407a}.tag.Kids{background:#f8d9d9;color:#8a2f2f}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green)}.bar i.o{background:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools input{flex:1;min-width:160px}
.top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;gap:8px;flex-wrap:wrap}.top h2{margin:0}
.muted{color:var(--mut)}.star{color:var(--gold);letter-spacing:2px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog label{display:block;font-size:12px;color:var(--mut);margin-top:10px}dialog input,dialog select,dialog textarea{width:100%}
.tip{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.tip span{font-size:22px}
.sw{position:relative;width:44px;height:26px;display:inline-block;flex:none}.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{left:21px}#app[data-lv=num] .lv2,#app[data-lv=num] .lv3,#app[data-lv=more] .lv3{display:none}
nav button{display:flex;align-items:center;gap:6px}.ni{font-size:16px}.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding:2px 0}.sub .btn{white-space:nowrap}.tile{cursor:pointer;text-align:center}
#fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:20}
@media (max-width:700px){nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;flex-wrap:nowrap;gap:0}nav button,nav button.on{flex-direction:column;gap:0;font-size:11px;border:0;background:transparent;border-radius:10px;padding:4px 2px;flex:1;color:var(--mut)}nav button.on{color:var(--red);font-weight:700}.ni{font-size:22px}main{padding-bottom:100px}#fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.ic{display:inline-flex;vertical-align:-.2em}.ic .i{width:1.15em;height:1.15em}h2 .ic,h3 .ic{color:var(--red)}.stat .e{color:var(--gold)}.garland{font-size:0!important;line-height:0;letter-spacing:0}
.sp{display:none}
@media (min-width:701px){.shell{display:flex;min-height:100vh}#side{width:232px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;padding:20px 12px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}#side .logo{padding:0 8px}#side nav{flex-direction:column;flex-wrap:nowrap;gap:4px}#side nav button{width:100%;justify-content:flex-start;border-radius:12px;padding:10px 12px;font-size:14px;border-color:transparent;background:transparent}#side nav button:hover{background:var(--bg)}#side nav button.on{background:var(--red);color:#fff}#side nav .ni{font-size:18px;width:24px;text-align:center}.sp{display:block;margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}#side #th{align-self:flex-start}.content{flex:1;min-width:0}main{padding-top:20px}}
@media (max-width:700px){#side{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}}
@media print{#side,header,.top .btn,.tools{display:none}body{background:#fff;color:#000}}

 else if(a==="addr")form("Add recipient",[{k:"name",l:"Name"},{k:"cat",l:"Category",lk:"cats"},{k:"cap",l:"Budget cap",t:"number"}],o=>{if(o.name.trim())S.rec.push({id:uid(),name:o.name.trim(),cat:o.cat,cap:N(o.cap)})});
 else if(a==="delr"){S.rec=S.rec.filter(r=>r.id!==v);render()}
 else if(a==="addi")form("Add idea",[{k:"name",l:"Gift idea"},{k:"rec",l:"For",v:""},{k:"price",l:"Rough price",t:"number"},{k:"stars",l:"Priority (1–3 stars)",o:["1","2","3"],v:"2"},{k:"link",l:"Link (optional)"}],o=>{if(o.name.trim())S.ideas.push({id:uid(),name:o.name,rec:o.rec||"Someone",price:N(o.price),stars:+o.stars,link:o.link})});
 else if(a==="star"){const i=S.ideas.find(x=>x.id===v);i.stars=i.stars%3+1;render()}

 else if(a==="reset")form("Start fresh?",[{l:"This clears all sample and saved data so you can add your own. It cannot be undone."}],()=>{S={...seed(),demo:false,rec:[],gifts:[],ideas:[],din:{guests:8,menu:[],tasks:{}},party:{guests:[],tasks:{},games:{},draw:null},ny:{res:[],tasks:{}}};tab="dash"},"Clear everything");

 else if(d.bg){S.bg.total=N(t.value);render()}
 else if(d.w){S.bg.w[d.w]=N(t.value);render()}
 else if(d.s){S[d.s]=t.value;render()}
 else if(t.id==="fc"){F.c=t.value;$("#gb").innerHTML=gRows()}
 else if(t.id==="fs"){F.s=t.value;$("#gb").innerHTML=gRows()}});
